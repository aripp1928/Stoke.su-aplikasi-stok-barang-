name: stokesu
description: "SETOKE.SU - Stok Terjaga, Kopi Selalu Istimewa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.0

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Utils
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  timeago: ^3.7.0
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Font judul (dipakai lewat fontFamily: 'serif' di seluruh aplikasi)
  fonts:
    - family: serif
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
